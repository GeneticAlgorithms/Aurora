<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#04070c;}
    #dither,#stage{position:fixed;inset:0;width:100%;height:100%;display:block;}
    #dither{z-index:0;image-rendering:pixelated;image-rendering:crisp-edges;}
    #stage{z-index:1;pointer-events:none;}
    #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
      background:radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);}
    #formula{position:fixed;left:50%;top:72%;transform:translateX(-50%);width:min(86vw,920px);
      text-align:center;color:#e8f4f7;opacity:0;transition:opacity .18s linear;z-index:3;
      text-shadow:0 0 18px rgba(120,200,215,.35);pointer-events:none;font-size:clamp(18px,3.2vw,36px);}
    #formula .katex{font-size:1em;color:#e8f4f7;}
    #eqname{position:fixed;left:50%;top:66%;transform:translateX(-50%);
      font-family:ui-monospace,monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;
      color:#79b6c2;opacity:0;transition:opacity .18s linear;text-shadow:0 0 12px rgba(90,170,190,.5);
      white-space:nowrap;z-index:3;pointer-events:none;}
    #caption{position:fixed;left:50%;top:90%;transform:translateX(-50%);width:min(80vw,720px);
      text-align:center;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:22px;line-height:1.45;
      color:#dfeef2;opacity:0;transition:opacity .18s linear;text-shadow:0 0 20px rgba(120,200,215,.35);
      z-index:3;pointer-events:none;}
    #actlabel{position:fixed;left:24px;bottom:20px;font-family:"Instrument Serif",serif;font-style:italic;
      font-size:18px;color:#8fb9c2;opacity:0;transition:opacity .5s ease;pointer-events:none;z-index:3;
      text-shadow:0 0 16px rgba(110,180,200,.4);}
    #hint{position:fixed;right:18px;bottom:16px;margin:0;font-family:ui-monospace,monospace;
      font-size:11px;color:#5f8791;opacity:.45;pointer-events:none;z-index:3;}
    kbd{color:#bfe2e8;}
    #wordmark{position:fixed;left:26px;bottom:20px;font-family:"Instrument Serif",serif;font-size:20px;
      letter-spacing:1px;color:rgba(220,238,242,0.55);text-shadow:0 0 14px rgba(130,200,215,.4);
      opacity:0;transition:opacity .9s ease;pointer-events:none;z-index:4;}
    #toast{position:fixed;left:0;right:0;bottom:34px;text-align:center;z-index:8;
      font-family:ui-monospace,monospace;font-size:11px;letter-spacing:2px;color:rgba(190,222,230,0.72);
      opacity:0;transition:opacity .6s;pointer-events:none;}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      font-family:"Instrument Serif",serif;font-style:italic;font-size:26px;color:#bfe0e6;
      background:#04070c;transition:opacity .6s ease;z-index:5;}
    #enter{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
      padding-bottom:13vh;box-sizing:border-box;text-align:center;cursor:pointer;opacity:0;transition:opacity 1.4s ease;
      background:radial-gradient(130% 100% at 50% 47%, rgba(4,7,12,0.24) 0%, rgba(4,7,12,0.5) 72%, rgba(4,7,12,0.66) 100%);}
    #enter.show{opacity:1;} #enter.hide{opacity:0;pointer-events:none;}
    #enter .cue{width:9px;height:9px;border-radius:50%;background:rgba(196,224,232,0.72);
      box-shadow:0 0 16px rgba(150,210,225,.6);animation:pulse 2.8s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:.9;transform:scale(1.55)}}
  </style>
</head>
<body>
  <canvas id="dither"></canvas>
  <canvas id="stage"></canvas>
  <div id="vignette"></div>
  <div id="formula"></div>
  <div id="eqname"></div>
  <div id="caption"></div>
  <div id="actlabel"></div>
  <div id="wordmark">aurora</div>
  <div id="toast"></div>
  <p id="hint"><kbd>O</kbd> play a track · <kbd>space</kbd> pause · <kbd>←</kbd>/<kbd>→</kbd> scrub · <kbd>S</kbd> skip · <kbd>R</kbd> restart · drag to disturb</p>
  <div id="loading">assembling the cosmos&hellip;</div>
  <div id="enter"><div class="cue"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
